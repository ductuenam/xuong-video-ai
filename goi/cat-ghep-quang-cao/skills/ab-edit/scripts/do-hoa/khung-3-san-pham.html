<!doctype html>
<!-- MẪU DÙNG CHUNG — Khung 3 sản phẩm/phiên bản (đổi ảnh ../media/..., nhãn, mốc HI = giây người nói đọc tên từng loại) (1440x1800, 3.6s): 3 dải ảnh trượt vào, nhãn sáng lên đúng lúc Thầy đọc "đồng – gỗ – gốm sứ". -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Be+Vietnam+Pro:wght@400;600&display=block&subset=vietnamese" rel="stylesheet">
<style>
:root{ /* ĐỔI MÀU THƯƠNG HIỆU Ở ĐÂY (lấy từ brand.json: do_hoa + chu) */
  --nen:#6A0B10; --nen-dam:#3A0508; --vien:#FFD94A; --accent:#FFD400; --box:#C8102E; --text:#FFFFFF;
  --font:'UTM Bebas','League Gothic',sans-serif; --body:'Be Vietnam Pro',sans-serif }
html,body{margin:0;width:1440px;height:1800px;overflow:hidden;background:var(--nen-dam)}
.hd{position:absolute;left:0;right:0;top:0;height:200px;display:flex;align-items:center;justify-content:center;
  background:var(--nen);border-bottom:6px solid var(--vien)}
.hd div{font-family:var(--font);font-size:120px;color:var(--accent);-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 4px 8px rgba(0,0,0,.5)}
.p{position:absolute;left:0;width:1440px;height:530px;overflow:hidden;border-bottom:6px solid var(--vien)}
.p img.bgi{position:absolute;left:0;top:50%;width:1440px;transform:translateY(-50%);filter:blur(18px) brightness(.55)}
.p img.fg{position:absolute;left:50%;height:700px;transform:translate(-50%,-50%)}
.lb{position:absolute;bottom:40px;font-family:var(--font);font-size:140px;color:#fff;text-transform:uppercase;-webkit-text-stroke:5px #000;paint-order:stroke fill;
  text-shadow:0 4px 8px #000,0 0 30px rgba(0,0,0,.6)}
</style></head><body>
<div class="hd" id="hd"><div>3 PHIÊN BẢN SẢN PHẨM</div></div>
<div class="p" id="p0" style="top:206px"><img class="bgi" src="../media/dong/dong7.jpg"><img class="fg" src="../media/dong/dong7.jpg" style="top:46%"><div class="lb" style="right:70px">Đồng</div></div>
<div class="p" id="p1" style="top:742px"><img class="bgi" src="../media/go/go2.jpg"><img class="fg" src="../media/go/go2.jpg" style="top:46%"><div class="lb" style="left:70px">Gỗ</div></div>
<div class="p" id="p2" style="top:1278px"><img class="bgi" src="../media/dat/dat7.jpg"><img class="fg" src="../media/dat/dat7.jpg" style="top:46%"><div class="lb" style="right:70px">Gốm Sứ</div></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IN=[0.1,0.3,0.5], HI=[1.83,2.49,2.88];
window.ve=function(t){
  const hd=document.getElementById('hd');hd.style.opacity=eo(t/0.3);
  [0,1,2].forEach(i=>{const p=document.getElementById('p'+i),q=eo((t-IN[i])/0.45),dir=i%2?1:-1;
    p.style.transform=`translateX(${(1-q)*1440*dir}px)`;p.querySelector('img.fg').style.transform=`translate(-50%,-50%) scale(${1+0.05*t/3.6})`;
    const lb=p.querySelector('.lb'),h=t-HI[i];const on=h>0?eb(h/0.35):0;
    lb.style.opacity=h>0?cl(h/0.15):0;lb.style.transform=`translateY(${h>0?(1-on)*20:20}px)`;
    lb.style.color=h>0&&h<0.6?getComputedStyle(document.documentElement).getPropertyValue('--accent'):'#fff';
    });
};
Promise.all([...document.images].map(i=>i.decode())).then(()=>document.fonts.ready).then(()=>Promise.all([document.fonts.load("100px 'League Gothic'"),document.fonts.load("100px 'UTM Bebas'")])).then(()=>{window.ve(0);window.SAN_SANG=true});
</script></body></html>
