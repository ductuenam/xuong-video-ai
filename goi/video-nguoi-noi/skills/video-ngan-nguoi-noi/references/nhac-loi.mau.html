<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhắc lời</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #999; font-family: "Segoe UI", Arial, sans-serif; }
  #cau { width: 620px; max-width: 94vw; margin: 12px auto 0; font-size: 34px; line-height: 1.3; font-weight: 600; text-align: center; }
  #tiep { width: 620px; max-width: 94vw; margin: 18px auto 0; font-size: 18px; line-height: 1.3; color: #555; text-align: center; }
  #so { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: #666; }
</style>
</head>
<body>
<div id="cau"></div>
<div id="tiep"></div>
<div id="so"></div>
<script>
  const cau = /*CAU*/[];
  let i = 0, co = 34;
  function ve() {
    document.getElementById("cau").textContent = cau[i];
    document.getElementById("cau").style.fontSize = co + "px";
    document.getElementById("tiep").textContent = cau[i + 1] || "(hết)";
    document.getElementById("so").textContent = (i + 1) + "/" + cau.length + " · Cách hoặc chạm: câu sau · ← hoặc chạm bên trái: câu trước · +/−: cỡ chữ";
  }
  addEventListener("keydown", e => {
    if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); i = Math.min(i + 1, cau.length - 1); }
    else if (e.key === "ArrowLeft") i = Math.max(i - 1, 0);
    else if (e.key === "+" || e.key === "=") co += 4;
    else if (e.key === "-") co = Math.max(20, co - 4);
    else return;
    ve();
  });
  addEventListener("click", e => { i = e.clientX < innerWidth / 3 ? Math.max(i - 1, 0) : Math.min(i + 1, cau.length - 1); ve(); });
  ve();
</script>
</body>
</html>
